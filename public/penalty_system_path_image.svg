<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 440" width="100%" height="100%" style="background-color: #ffffff; font-family: 'Microsoft JhengHei', 'PingFang TC', 'Noto Sans TC', sans-serif;">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- Left Panel: 常用應用程式 -->
  <g transform="translate(15, 15)">
    <!-- Title -->
    <text x="5" y="24" font-size="20" font-weight="bold" fill="#333333" letter-spacing="1">常用應用程式</text>

    <!-- App Button 1: 文件管理 -->
    <g transform="translate(0, 48)">
      <rect x="0" y="0" width="350" height="52" rx="4" fill="#ffffff" stroke="#dcdcdc" stroke-width="1.2" filter="url(#shadow)" />
      <!-- Left icon badge -->
      <path d="M 4 4 L 45 4 C 55 4 60 14 60 26 C 60 38 55 48 45 48 L 4 48 Z" fill="#eb6120" />
      <!-- Folder icon in badge -->
      <path d="M 16 16 L 26 16 L 30 20 L 44 20 L 44 36 L 16 36 Z" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linejoin="round" />
      <text x="75" y="33" font-size="16" fill="#333333" font-weight="500">文件管理</text>
    </g>

    <!-- App Button 2: 訊息整合平台 -->
    <g transform="translate(0, 112)">
      <rect x="0" y="0" width="350" height="52" rx="4" fill="#ffffff" stroke="#dcdcdc" stroke-width="1.2" filter="url(#shadow)" />
      <!-- Left icon badge -->
      <path d="M 4 4 L 45 4 C 55 4 60 14 60 26 C 60 38 55 48 45 48 L 4 48 Z" fill="#0038e6" />
      <!-- Code / Message icon -->
      <rect x="18" y="16" width="24" height="20" rx="3" fill="none" stroke="#ffffff" stroke-width="2" />
      <path d="M 24 22 L 21 26 L 24 30 M 36 22 L 39 26 L 36 30" fill="none" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
      <text x="75" y="33" font-size="16" fill="#333333" font-weight="500">訊息整合平台</text>
    </g>

    <!-- App Button 3: 電子會議 -->
    <g transform="translate(0, 176)">
      <rect x="0" y="0" width="350" height="52" rx="4" fill="#ffffff" stroke="#dcdcdc" stroke-width="1.2" filter="url(#shadow)" />
      <!-- Left icon badge -->
      <path d="M 4 4 L 45 4 C 55 4 60 14 60 26 C 60 38 55 48 45 48 L 4 48 Z" fill="#880e4f" />
      <!-- Sprout / conference icon -->
      <path d="M 30 36 L 30 24 M 30 28 C 24 24 20 28 20 28 C 20 28 24 34 30 32 M 30 25 C 36 21 40 25 40 25 C 40 25 36 31 30 29" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
      <circle cx="26" cy="18" r="2.5" fill="#ffffff" />
      <text x="75" y="33" font-size="16" fill="#333333" font-weight="500">電子會議</text>
    </g>

    <!-- App Button 4: 罰鍰系統 (Active, Red Box Highlighted) -->
    <g transform="translate(0, 240)">
      <!-- Background button -->
      <rect x="0" y="0" width="350" height="52" rx="4" fill="#8d5638" />
      <!-- Left badge icon -->
      <path d="M 4 4 L 45 4 C 55 4 60 14 60 26 C 60 38 55 48 45 48 L 4 48 Z" fill="#683d24" />
      <!-- Monitor / TV icon -->
      <rect x="18" y="16" width="24" height="17" rx="2" fill="none" stroke="#ffffff" stroke-width="2" />
      <line x1="24" y1="33" x2="20" y2="37" stroke="#ffffff" stroke-width="2" stroke-linecap="round" />
      <line x1="36" y1="33" x2="40" y2="37" stroke="#ffffff" stroke-width="2" stroke-linecap="round" />
      <line x1="20" y1="37" x2="40" y2="37" stroke="#ffffff" stroke-width="2" stroke-linecap="round" />
      <text x="75" y="33" font-size="16" fill="#ffffff" font-weight="bold">罰鍰系統</text>

      <!-- Red Outline Box (User's mark) -->
      <rect x="1" y="1" width="245" height="50" rx="2" fill="none" stroke="#e00000" stroke-width="3.2" />
    </g>
  </g>

  <!-- Vertical Divider Line -->
  <line x1="380" y1="0" x2="380" y2="440" stroke="#cccccc" stroke-width="1" />

  <!-- Right Panel: 罰鍰系統 -->
  <g transform="translate(385, 0)">
    <!-- Top Green Banner: 罰鍰系統 -->
    <rect x="0" y="0" width="435" height="65" fill="#7ba23f" />
    <text x="12" y="50" font-size="44" font-family="'DFKai-SB', 'BiauKai', 'Noto Serif TC', serif" font-weight="bold" fill="#ffffff" stroke="#1f440a" stroke-width="2" paint-order="stroke fill" letter-spacing="8">罰鍰系統</text>

    <!-- Navigation Bar -->
    <g transform="translate(0, 65)">
      <rect x="0" y="0" width="435" height="24" fill="#f0f0f0" />
      <!-- Tab: 罰鍰系統 -->
      <rect x="10" y="2" width="75" height="20" rx="3" fill="#000080" />
      <text x="20" y="16" font-size="12" font-weight="bold" fill="#ffffff">罰鍰系統</text>

      <text x="95" y="16" font-size="12" fill="#333333">文件下載區</text>
      <text x="168" y="16" font-size="12" fill="#888888">|</text>
      <text x="180" y="16" font-size="12" fill="#333333">PDF閱讀器下載</text>
      <text x="280" y="16" font-size="12" fill="#888888">|</text>
    </g>

    <!-- Subheader Bar: 功能選單 & 現在位置 -->
    <g transform="translate(0, 89)">
      <rect x="0" y="0" width="435" height="28" fill="#e8edf2" stroke="#d5dce2" stroke-width="1" />
      <!-- Back arrow icon -->
      <path d="M 8 14 L 3 14 M 3 14 L 6 11 M 3 14 L 6 17" stroke="#333333" stroke-width="1.5" />
      <!-- Computer icon -->
      <rect x="18" y="7" width="14" height="11" rx="1" fill="#3a75c4" />
      <rect x="20" y="9" width="10" height="7" fill="#ffffff" />
      <rect x="22" y="18" width="6" height="3" fill="#666666" />
      <text x="36" y="19" font-size="13" font-weight="bold" fill="#1b395f">功能選單</text>

      <!-- Right side: 現在位置 -->
      <rect x="260" y="0" width="175" height="28" fill="#fffbe8" />
      <text x="270" y="19" font-size="13" font-weight="bold" fill="#8a6d0b">現在位置</text>
    </g>

    <!-- Tree View Menu Container -->
    <g transform="translate(0, 117)">
      <rect x="0" y="0" width="435" height="323" fill="#f4f8fa" />

      <!-- Tree Vertical guide lines -->
      <line x1="28" y1="20" x2="28" y2="310" stroke="#aaaaaa" stroke-dasharray="1 2" stroke-width="1" />
      <line x1="48" y1="42" x2="48" y2="160" stroke="#aaaaaa" stroke-dasharray="1 2" stroke-width="1" />

      <!-- Node 1: [-] 罰鍰管理作業 (Expanded) -->
      <g transform="translate(18, 12)">
        <!-- Minus Box -->
        <rect x="0" y="0" width="13" height="13" fill="#ffffff" stroke="#666666" stroke-width="1" />
        <line x1="3" y1="6.5" x2="10" y2="6.5" stroke="#333333" stroke-width="1.2" />
        <!-- Folder Icon (Open) -->
        <path d="M 18 3 L 26 3 L 29 6 L 38 6 L 38 14 L 18 14 Z" fill="#f7ca44" stroke="#c99516" stroke-width="1" />
        <text x="44" y="12" font-size="13" font-weight="bold" fill="#222222">罰鍰管理作業</text>
      </g>

      <!-- Child 1.1: [處分書資料維護] (Highlighted with Red Box) -->
      <g transform="translate(42, 34)">
        <line x1="-14" y1="10" x2="0" y2="10" stroke="#aaaaaa" stroke-dasharray="1 2" stroke-width="1" />
        <!-- Document icon -->
        <rect x="0" y="1" width="13" height="16" fill="#ffffff" stroke="#5a88c2" stroke-width="1" />
        <line x1="3" y1="5" x2="10" y2="5" stroke="#888888" stroke-width="1" />
        <line x1="3" y1="8" x2="10" y2="8" stroke="#888888" stroke-width="1" />
        <line x1="3" y1="11" x2="8" y2="11" stroke="#888888" stroke-width="1" />
        <text x="20" y="14" font-size="13" font-weight="bold" fill="#111111">處分書資料維護</text>

        <!-- Red Rectangle Highlight Box (Exact like user uploaded screenshot) -->
        <rect x="-8" y="-4" width="180" height="27" fill="none" stroke="#e00000" stroke-width="2.8" />
      </g>

      <!-- Child 1.2: [+] 報表 -->
      <g transform="translate(38, 64)">
        <line x1="-10" y1="7" x2="0" y2="7" stroke="#aaaaaa" stroke-dasharray="1 2" stroke-width="1" />
        <!-- Plus Box -->
        <rect x="0" y="0" width="13" height="13" fill="#ffffff" stroke="#666666" stroke-width="1" />
        <line x1="3" y1="6.5" x2="10" y2="6.5" stroke="#333333" stroke-width="1.2" />
        <line x1="6.5" y1="3" x2="6.5" y2="10" stroke="#333333" stroke-width="1.2" />
        <!-- Folder Icon -->
        <path d="M 18 3 L 26 3 L 29 6 L 38 6 L 38 14 L 18 14 Z" fill="#f7ca44" stroke="#c99516" stroke-width="1" />
        <text x="44" y="12" font-size="13" fill="#333333">報表</text>
      </g>

      <!-- Child 1.3: 應收保留款批次註銷 -->
      <g transform="translate(42, 86)">
        <line x1="-14" y1="8" x2="0" y2="8" stroke="#aaaaaa" stroke-dasharray="1 2" stroke-width="1" />
        <rect x="0" y="1" width="13" height="15" fill="#ffffff" stroke="#5a88c2" stroke-width="1" />
        <text x="20" y="13" font-size="12.5" fill="#333333">應收保留款批次註銷</text>
      </g>

      <!-- Child 1.4: 處分書暫存檔資料維護 -->
      <g transform="translate(42, 107)">
        <line x1="-14" y1="8" x2="0" y2="8" stroke="#aaaaaa" stroke-dasharray="1 2" stroke-width="1" />
        <rect x="0" y="1" width="13" height="15" fill="#ffffff" stroke="#5a88c2" stroke-width="1" />
        <text x="20" y="13" font-size="12.5" fill="#333333">處分書暫存檔資料維護</text>
      </g>

      <!-- Child 1.5: 移送資料補登作業 -->
      <g transform="translate(42, 128)">
        <line x1="-14" y1="8" x2="0" y2="8" stroke="#aaaaaa" stroke-dasharray="1 2" stroke-width="1" />
        <rect x="0" y="1" width="13" height="15" fill="#ffffff" stroke="#5a88c2" stroke-width="1" />
        <text x="20" y="13" font-size="12.5" fill="#333333">移送資料補登作業</text>
      </g>

      <!-- Child 1.6: 刪除處分書主檔暫存資料查詢 -->
      <g transform="translate(42, 149)">
        <line x1="-14" y1="8" x2="0" y2="8" stroke="#aaaaaa" stroke-dasharray="1 2" stroke-width="1" />
        <rect x="0" y="1" width="13" height="15" fill="#ffffff" stroke="#5a88c2" stroke-width="1" />
        <text x="20" y="13" font-size="12.5" fill="#333333">刪除處分書主檔暫存資料查詢</text>
      </g>

      <!-- Node 2: [+] 罰鍰報表作業 -->
      <g transform="translate(18, 172)">
        <rect x="0" y="0" width="13" height="13" fill="#ffffff" stroke="#666666" stroke-width="1" />
        <line x1="3" y1="6.5" x2="10" y2="6.5" stroke="#333333" stroke-width="1.2" />
        <line x1="6.5" y1="3" x2="6.5" y2="10" stroke="#333333" stroke-width="1.2" />
        <path d="M 18 3 L 26 3 L 29 6 L 38 6 L 38 14 L 18 14 Z" fill="#f7ca44" stroke="#c99516" stroke-width="1" />
        <text x="44" y="12" font-size="13" fill="#333333">罰鍰報表作業</text>
      </g>

      <!-- Node 3: [+] 代碼管理作業 -->
      <g transform="translate(18, 196)">
        <rect x="0" y="0" width="13" height="13" fill="#ffffff" stroke="#666666" stroke-width="1" />
        <line x1="3" y1="6.5" x2="10" y2="6.5" stroke="#333333" stroke-width="1.2" />
        <line x1="6.5" y1="3" x2="6.5" y2="10" stroke="#333333" stroke-width="1.2" />
        <path d="M 18 3 L 26 3 L 29 6 L 38 6 L 38 14 L 18 14 Z" fill="#f7ca44" stroke="#c99516" stroke-width="1" />
        <text x="44" y="12" font-size="13" fill="#333333">代碼管理作業</text>
      </g>

      <!-- Node 4: [+] 繳款書銷帳作業 -->
      <g transform="translate(18, 220)">
        <rect x="0" y="0" width="13" height="13" fill="#ffffff" stroke="#666666" stroke-width="1" />
        <line x1="3" y1="6.5" x2="10" y2="6.5" stroke="#333333" stroke-width="1.2" />
        <line x1="6.5" y1="3" x2="6.5" y2="10" stroke="#333333" stroke-width="1.2" />
        <path d="M 18 3 L 26 3 L 29 6 L 38 6 L 38 14 L 18 14 Z" fill="#f7ca44" stroke="#c99516" stroke-width="1" />
        <text x="44" y="12" font-size="13" fill="#333333">繳款書銷帳作業</text>
      </g>

      <!-- Node 5: [+] 管理性報表作業 -->
      <g transform="translate(18, 244)">
        <rect x="0" y="0" width="13" height="13" fill="#ffffff" stroke="#666666" stroke-width="1" />
        <line x1="3" y1="6.5" x2="10" y2="6.5" stroke="#333333" stroke-width="1.2" />
        <line x1="6.5" y1="3" x2="6.5" y2="10" stroke="#333333" stroke-width="1.2" />
        <path d="M 18 3 L 26 3 L 29 6 L 38 6 L 38 14 L 18 14 Z" fill="#f7ca44" stroke="#c99516" stroke-width="1" />
        <text x="44" y="12" font-size="13" fill="#333333">管理性報表作業</text>
      </g>

      <!-- Node 6: [+] 資料轉檔 -->
      <g transform="translate(18, 268)">
        <rect x="0" y="0" width="13" height="13" fill="#ffffff" stroke="#666666" stroke-width="1" />
        <line x1="3" y1="6.5" x2="10" y2="6.5" stroke="#333333" stroke-width="1.2" />
        <line x1="6.5" y1="3" x2="6.5" y2="10" stroke="#333333" stroke-width="1.2" />
        <path d="M 18 3 L 26 3 L 29 6 L 38 6 L 38 14 L 18 14 Z" fill="#f7ca44" stroke="#c99516" stroke-width="1" />
        <text x="44" y="12" font-size="13" fill="#333333">資料轉檔</text>
      </g>
    </g>
  </g>
</svg>