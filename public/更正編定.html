<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>更正編定小工具</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;700&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#1F3864; --paper:#FBF7EE; --card:#FFFFFF;
  --ink:#2A2822; --ink-soft:#5B584E; --line:#E4DCC8; --amber:#9C6B14; --seal:#9C3B30; --pine:#3E6952;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --paper:#1C1A15; --card:#28251E; --ink:#F0ECE1; --ink-soft:#C2BCAA; --line:#42402F; }
}
:root[data-theme="dark"]{ --paper:#1C1A15; --card:#28251E; --ink:#F0ECE1; --ink-soft:#C2BCAA; --line:#42402F; }
*{margin:0;padding:0;box-sizing:border-box;}
body{background:var(--paper); color:var(--ink); font-family:"Noto Sans TC",system-ui,sans-serif; line-height:1.85; font-size:19px;}
h1,.serif{font-family:"Noto Serif TC",serif;}
header{padding:26px clamp(18px,4vw,44px); border-bottom:3px solid var(--navy); background:var(--card);}
header h1{font-size:clamp(23px,3.2vw,29px); color:var(--navy); font-weight:700;}
header p{font-size:15px; color:var(--ink-soft); margin-top:6px;}
main{max-width:1080px; margin:0 auto; padding:clamp(18px,4vw,36px);}
.layout{display:grid; grid-template-columns:380px 1fr; gap:28px; align-items:start;}
.layout>div:first-child{order:1;} .layout>div:last-child{order:2;}
@media (max-width:860px){ .layout{grid-template-columns:1fr;} .layout>div:first-child{order:2;} .layout>div:last-child{order:1;} }
h2.section{font-size:clamp(19px,2.3vw,22px); color:var(--navy); font-family:"Noto Serif TC",serif; margin:0 0 12px;}
.flow-card{background:var(--card); border:2px solid var(--line); border-radius:14px; padding:clamp(14px,3vw,22px); position:sticky; top:16px;}
.flow-card svg{width:100%; height:auto; display:block;}
.fc-t{font-size:15px; font-weight:700;}
.fc-s{font-size:12.5px;}
.card{background:var(--card); border:2px solid var(--line); border-radius:14px; padding:clamp(22px,3vw,30px); border-left-width:7px; border-left-color:var(--navy); margin-top:14px;}
.eyebrow{font-size:14.5px; color:var(--ink-soft); font-weight:700; margin-bottom:9px;}
.card h3{font-size:clamp(19px,2.3vw,22px); color:var(--navy); font-family:"Noto Serif TC",serif; margin-bottom:16px;}
.opts{display:flex; flex-direction:column; gap:12px;}
.opt-btn{text-align:left; padding:17px 20px; border:2px solid var(--line); border-radius:10px; background:var(--paper); color:var(--ink); font-size:18px; font-family:inherit; cursor:pointer;}
.opt-btn:hover{border-color:var(--navy);}
.warn{background:#FBEEEE; border-left:5px solid var(--seal); border-radius:8px; padding:18px 20px; font-size:17px; color:var(--ink); margin-top:8px;}
.docs-label{font-weight:900; color:var(--navy); margin-top:10px; margin-bottom:4px; font-size:16px;}
ul.check{padding-left:24px; margin-top:8px;}
ul.check li{margin-bottom:9px; font-size:17px;}
.ghost-btn{margin-top:20px; padding:12px 20px; background:transparent; color:var(--navy); border:2px solid var(--navy); border-radius:8px; font-family:inherit; font-size:16px; cursor:pointer;}
.badge{display:inline-block; background:var(--navy); color:#fff; font-size:12.5px; font-weight:700; padding:3px 10px; border-radius:20px; margin-bottom:10px;}
footer{max-width:760px;margin:0 auto;padding:10px clamp(18px,4vw,36px) 44px;color:var(--ink-soft);font-size:13px;}
</style>
</head>
<body>
<header>
  <h1 class="serif">更正編定小工具</h1>
  <p>上半部是辦理流程總覽，下半部協助判斷應備文件清單</p>
</header>
<main>
  <div class="layout">
    <div>
      <h2 class="section">辦理流程總覽</h2>
      <div class="flow-card" id="flowCard"></div>
    </div>
    <div>
      <h2 class="section">應備文件判斷</h2>
      <div id="tool"></div>
    </div>
  </div>
</main>
<footer>依「製定非都市土地使用分區圖及編定各種使用地作業須知」第23點及相關規定整理。</footer>

<script>
function box(x,y,w,h,title,sub){
  const cx=x+w/2; const titleY = sub ? y+h*0.38 : y+h/2;
  let t = `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="7" fill="var(--card)" stroke="var(--navy)" stroke-width="1.4"/>`;
  t += `<text class="fc-t" x="${cx}" y="${titleY}" text-anchor="middle" dominant-baseline="central" fill="var(--navy)">${title}</text>`;
  if(sub) t += `<text class="fc-s" x="${cx}" y="${y+h*0.72}" text-anchor="middle" dominant-baseline="central" fill="var(--ink-soft)">${sub}</text>`;
  return t;
}
function arrow(d){ return `<path d="${d}" fill="none" stroke="var(--line)" stroke-width="1.6" marker-end="url(#a)"/>`; }

function renderFlow(){
  let s = `<svg viewBox="0 0 400 760" role="img"><title>更正編定辦理流程</title>
  <defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="var(--line)" stroke-width="1.6"/></marker></defs>`;
  s += box(60,10,280,40,"收件");
  s += arrow("M200 50 L200 68");
  s += box(60,68,280,54,"初步書面審查","確認權利人、謄本、證明文件齊全");
  s += arrow("M200 122 L200 140");
  s += box(60,140,280,40,"會辦各單位＋排定會勘");
  s += arrow("M200 180 L200 198");
  s += box(60,198,280,40,"補正（非必要，15天）");
  s += arrow("M200 238 L200 256");
  s += box(60,256,280,40,"簽核（簽稿併陳）或駁回");
  s += arrow("M200 296 L200 304 L103 304 L103 312");
  s += arrow("M200 296 L200 304 L303 304 L303 312");
  s += box(5,312,195,58,"整筆更正","核准文送地所辦異動");
  s += box(210,312,185,58,"部分更正","先辦分割，地政局核位置");
  s += arrow("M103 370 L103 378 L200 378 L200 382");
  s += arrow("M303 370 L303 378 L200 378 L200 382");
  s += box(60,382,280,40,"地所完成登記，會報地政局備查");
  s += arrow("M200 422 L200 440");
  s += box(60,440,280,40,"同意備查，案件結案");
  s += `</svg>`;
  document.getElementById("flowCard").innerHTML = s;
}
renderFlow();

const CHECKLISTS = {
  buildingLand: {
    badge: "態樣Ａ", title: "更正為建築用地",
    docs: [
      "建管前建物面積證明合法文件（擇一）：房屋稅籍、建物登記謄本、建築使用執照、工業技術研究院歷史航照圖判讀建物面積",
      "建築管理日期或公告編定日期（70年2月15日，或對應較早之日期）前已作住家使用之合法文件：戶籍設籍證明、用水用電證明（須載明住家用）",
      "土地謄本、申請人身分證明文件、土地更正編定同意書",
    ]
  },
  otherGeneral: {
    badge: "態樣Ｂ・一般", title: "更正為其他用地（一般情形）",
    docs: [
      "70年2月15日公告編定前或編定期間已變更使用之合法證明文件",
      "面積證明合法文件：建築使用執照、主管機關認定文件等",
      "土地謄本、申請人身分證明文件、土地更正編定同意書",
    ]
  },
  otherPublic: {
    badge: "態樣Ｂ・供公眾使用建築物", title: "更正為其他用地（如寺廟等）",
    docs: [
      "供公眾使用建築物適用之建築管理日期（60年12月22日）前已變更使用之合法證明文件（此日期提前，非一般公告編定日期70年2月15日）",
      "面積證明合法文件：建築使用執照、主管機關認定等",
      "土地謄本、申請人身分證明文件、土地更正編定同意書",
    ]
  }
};

let step = "q0";

function renderCard(eyebrow, title, bodyHtml){
  document.getElementById("tool").innerHTML = `<div class="card"><div class="eyebrow">${eyebrow}</div><h3>${title}</h3>${bodyHtml}</div>`;
}

function renderChecklist(key){
  const r = CHECKLISTS[key];
  renderCard(r.badge, r.title, `
    <div class="docs-label">應備文件</div>
    <ul class="check">${r.docs.map(d=>`<li>${d}</li>`).join("")}</ul>
    <button class="ghost-btn" id="restart">重新判斷另一筆案件</button>
  `);
  document.getElementById("restart").onclick = ()=>{ step="q0"; render(); };
}

function render(){
  if(step==="q0"){
    renderCard("前提篩選", "申請人能否提出客觀證明，使用或建物時點早於適用的建築管理日期或公告編定日期？", `
      <div class="opts">
        <button class="opt-btn" id="y0">能，時點確實早於該日期</button>
        <button class="opt-btn" id="n0">不能，或時點晚於該日期</button>
      </div>`);
    document.getElementById("y0").onclick = ()=>{ step="q1"; render(); };
    document.getElementById("n0").onclick = ()=>{
      renderCard("前提篩選", "申請人能否提出客觀證明，使用或建物時點早於適用的建築管理日期或公告編定日期？", `
        <div class="warn">這不是「編定錯誤」，而是使用性質事後改變，不符合更正編定要件。應請申請人改走變更編定程序，而非受理更正編定。</div>
        <button class="ghost-btn" id="restart2">重新判斷另一筆案件</button>`);
      document.getElementById("restart2").onclick = ()=>{ step="q0"; render(); };
    };
  } else if(step==="q1"){
    renderCard("判斷點", "擬更正為下列哪一種用地？", `
      <div class="opts">
        <button class="opt-btn" id="b1">建築用地</button>
        <button class="opt-btn" id="b2">其他用地</button>
      </div>`);
    document.getElementById("b1").onclick = ()=>renderChecklist("buildingLand");
    document.getElementById("b2").onclick = ()=>{ step="q2"; render(); };
  } else if(step==="q2"){
    renderCard("判斷點", "申請標的是否屬建築法第5條規定之供公眾使用建築物（如寺廟）？", `
      <div class="opts">
        <button class="opt-btn" id="p1">是</button>
        <button class="opt-btn" id="p2">否，一般情形</button>
      </div>`);
    document.getElementById("p1").onclick = ()=>renderChecklist("otherPublic");
    document.getElementById("p2").onclick = ()=>renderChecklist("otherGeneral");
  }
}
render();
</script>
</body>
</html>
