<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 540" width="100%" height="100%" style="background-color: #f8fafc; font-family: 'Microsoft JhengHei', 'PingFang TC', 'Noto Sans TC', sans-serif;">
  <defs>
    <filter id="shadow-md" x="-3%" y="-3%" width="106%" height="106%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.12" />
    </filter>
  </defs>

  <!-- Title / Breadcrumb Bar -->
  <g transform="translate(20, 16)">
    <rect x="0" y="0" width="900" height="36" rx="6" fill="#0891b2" />
    <text x="16" y="23" font-size="14" font-weight="bold" fill="#ffffff">
      119200306 - 非都市土地使用地變更編定筆數及面積 查詢與資料檢核
    </text>
  </g>

  <!-- Query Panel (Top) -->
  <g transform="translate(20, 60)">
    <rect x="0" y="0" width="900" height="74" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#shadow-md)" />

    <text x="24" y="28" font-size="12" fill="#475569" font-weight="bold">機關縣市：</text>
    <rect x="90" y="12" width="120" height="26" rx="3" fill="#f1f5f9" stroke="#94a3b8" />
    <text x="100" y="29" font-size="12" fill="#0f172a">新北市 ▾</text>

    <text x="235" y="28" font-size="12" fill="#475569" font-weight="bold">行政區：</text>
    <rect x="290" y="12" width="220" height="26" rx="3" fill="#f1f5f9" stroke="#94a3b8" />
    <text x="300" y="29" font-size="11" fill="#dc2626">▾ 未選擇行政區時，查詢全部行政區</text>

    <!-- 申報區間 with red highlight box -->
    <text x="24" y="58" font-size="12" fill="#475569" font-weight="bold">申報區間：</text>
    <text x="90" y="58" font-size="12" fill="#0f172a">民國</text>
    <rect x="120" y="42" width="55" height="26" rx="3" fill="#ffffff" stroke="#94a3b8" />
    <text x="135" y="59" font-size="12" font-weight="bold" fill="#0f172a">115</text>
    <text x="182" y="58" font-size="12" fill="#0f172a">年</text>
    <rect x="202" y="42" width="85" height="26" rx="3" fill="#ffffff" stroke="#94a3b8" />
    <text x="214" y="59" font-size="12" font-weight="bold" fill="#0f172a">上半年 ▾</text>

    <!-- Red box around 申報區間 & 執行查詢 -->
    <rect x="85" y="38" width="206" height="32" rx="4" fill="none" stroke="#dc2626" stroke-width="2.2" />

    <!-- 執行查詢 Button -->
    <rect x="310" y="42" width="95" height="26" rx="4" fill="#0284c7" />
    <text x="357" y="59" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">🔍 執行查詢</text>
    <rect x="308" y="40" width="99" height="30" rx="5" fill="none" stroke="#dc2626" stroke-width="2.5" />

    <!-- Red prompt badge -->
    <g transform="translate(425, 41)">
      <polygon points="0,14 10,6 10,22" fill="#dc2626" />
      <rect x="10" y="0" width="270" height="28" rx="4" fill="#dc2626" />
      <text x="20" y="18" font-size="11.5" font-weight="bold" fill="#ffffff">先填年份、上半年(下半年)後，執行查詢</text>
    </g>
  </g>

  <!-- Left: District Results Table (29 Districts) -->
  <g transform="translate(20, 144)">
    <rect x="0" y="0" width="410" height="380" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#shadow-md)" />

    <!-- Table Header -->
    <rect x="0" y="0" width="410" height="32" rx="6" fill="#0f172a" />
    <text x="14" y="21" font-size="11" font-weight="bold" fill="#ffffff">序號</text>
    <text x="46" y="21" font-size="11" font-weight="bold" fill="#ffffff">編輯正式資料</text>
    <text x="140" y="21" font-size="11" font-weight="bold" fill="#ffffff">行政區</text>
    <text x="200" y="21" font-size="11" font-weight="bold" fill="#ffffff">年份/期別</text>
    <text x="280" y="21" font-size="11" font-weight="bold" fill="#ffffff">狀態</text>
    <text x="330" y="21" font-size="11" font-weight="bold" fill="#ffffff">填報時間</text>

    <!-- Row 1: 萬里區 -->
    <rect x="0" y="32" width="410" height="34" fill="#eff6ff" />
    <text x="20" y="53" font-size="11" fill="#475569">1</text>
    <!-- Edit Icon Button (Highlighted in Red) -->
    <rect x="58" y="38" width="22" height="22" rx="3" fill="#ffffff" stroke="#0284c7" stroke-width="1.2" />
    <text x="64" y="54" font-size="12" fill="#0284c7">📝</text>
    <rect x="55" y="35" width="28" height="28" rx="4" fill="none" stroke="#dc2626" stroke-width="2.2" />
    <text x="140" y="53" font-size="12" font-weight="bold" fill="#1e293b">萬里區</text>
    <text x="200" y="53" font-size="11" fill="#475569">115 上半年</text>
    <rect x="274" y="40" width="46" height="18" rx="3" fill="#dcfce7" />
    <text x="297" y="53" font-size="10.5" font-weight="bold" fill="#15803d" text-anchor="middle">已填報</text>
    <text x="330" y="53" font-size="10" fill="#64748b">07/12 23:57</text>

    <!-- Callout note: 點這裡可以看到各區的數據 -->
    <g transform="translate(88, 70)">
      <polygon points="12,0 20,8 4,8" fill="#dc2626" />
      <rect x="0" y="8" width="165" height="26" rx="4" fill="#dc2626" />
      <text x="10" y="25" font-size="11" font-weight="bold" fill="#ffffff">點這裡可以看各區的數據</text>
    </g>

    <!-- Row 2: 金山區 -->
    <rect x="0" y="108" width="410" height="34" fill="#ffffff" />
    <text x="20" y="129" font-size="11" fill="#475569">2</text>
    <rect x="58" y="114" width="22" height="22" rx="3" fill="#ffffff" stroke="#94a3b8" />
    <text x="64" y="130" font-size="12" fill="#475569">📝</text>
    <text x="140" y="129" font-size="12" font-weight="bold" fill="#1e293b">金山區</text>
    <text x="200" y="129" font-size="11" fill="#475569">115 上半年</text>
    <rect x="274" y="116" width="46" height="18" rx="3" fill="#dcfce7" />
    <text x="297" y="129" font-size="10.5" font-weight="bold" fill="#15803d" text-anchor="middle">已填報</text>
    <text x="330" y="129" font-size="10" fill="#64748b">07/12 23:57</text>

    <!-- Row 3: 板橋區 -->
    <rect x="0" y="142" width="410" height="34" fill="#f8fafc" />
    <text x="20" y="163" font-size="11" fill="#475569">3</text>
    <rect x="58" y="148" width="22" height="22" rx="3" fill="#ffffff" stroke="#94a3b8" />
    <text x="64" y="164" font-size="12" fill="#475569">📝</text>
    <text x="140" y="163" font-size="12" font-weight="bold" fill="#1e293b">板橋區</text>
    <text x="200" y="163" font-size="11" fill="#475569">115 上半年</text>
    <rect x="274" y="150" width="46" height="18" rx="3" fill="#dcfce7" />
    <text x="297" y="163" font-size="10.5" font-weight="bold" fill="#15803d" text-anchor="middle">已填報</text>
    <text x="330" y="163" font-size="10" fill="#64748b">07/12 09:36</text>

    <!-- Ellipsis for 29 districts -->
    <text x="180" y="200" font-size="14" fill="#94a3b8" font-weight="bold">... (全數 29 個行政區) ...</text>

    <!-- Bottom summary box -->
    <rect x="12" y="235" width="386" height="130" rx="6" fill="#fef2f2" stroke="#fecaca" />
    <text x="24" y="260" font-size="13" font-weight="bold" fill="#b91c1c">⚠️ 內政部系統檢核關鍵時限：</text>
    <text x="24" y="285" font-size="11.5" fill="#7f1d1d" font-weight="bold">• 新北市共 29 個行政區，每區有 4 張表</text>
    <text x="24" y="305" font-size="11.5" fill="#7f1d1d" font-weight="bold">• 總計有 116 張表（需全數確認無誤）</text>
    <text x="24" y="330" font-size="12" fill="#dc2626" font-weight="bold">⏰ 上半年 7/15 前 ｜ 下半年 1/15 前確認完成</text>
    <text x="24" y="350" font-size="11" fill="#991b1b">（免紙本陳核、免系統報送，只要確認地所數據無誤）</text>
  </g>

  <!-- Right: Detailed Verification Window (119200306 Form Values) -->
  <g transform="translate(445, 144)">
    <rect x="0" y="0" width="475" height="380" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#shadow-md)" />

    <!-- Sub-window header -->
    <rect x="0" y="0" width="475" height="32" rx="6" fill="#0369a1" />
    <text x="14" y="21" font-size="12" font-weight="bold" fill="#ffffff">
      萬里區 - 119200306 變更編定筆數及面積 編輯核對表
    </text>

    <!-- Grid Table -->
    <g transform="translate(10, 42)">
      <!-- Header row -->
      <rect x="0" y="0" width="455" height="26" fill="#f1f5f9" stroke="#cbd5e1" />
      <text x="12" y="17" font-size="11" font-weight="bold" fill="#334155">變更後_類別 / 變更前_類別</text>
      <text x="280" y="17" font-size="11" font-weight="bold" fill="#334155" text-anchor="middle">筆數（整數）</text>
      <text x="385" y="17" font-size="11" font-weight="bold" fill="#334155" text-anchor="middle">面積（公頃，6位小數）</text>

      <!-- Row 1: 變更前_總計 (Red border box) -->
      <rect x="0" y="26" width="455" height="30" fill="#fffbeb" stroke="#cbd5e1" />
      <text x="12" y="46" font-size="12" font-weight="bold" fill="#0f172a">變更前_總計</text>
      <text x="280" y="46" font-size="13" font-weight="bold" fill="#dc2626" text-anchor="middle">46</text>
      <text x="385" y="46" font-size="12" font-weight="bold" fill="#dc2626" text-anchor="middle">4.030026</text>
      <!-- Big red highlight box -->
      <rect x="-2" y="24" width="459" height="34" rx="4" fill="none" stroke="#dc2626" stroke-width="2.5" />

      <!-- Row 2: 丙種建築用地 -->
      <rect x="0" y="56" width="455" height="24" fill="#ffffff" stroke="#cbd5e1" />
      <text x="20" y="72" font-size="11" fill="#475569">變更前_丙種建築用地</text>
      <text x="280" y="72" font-size="11" fill="#0f172a" text-anchor="middle">3</text>
      <text x="385" y="72" font-size="11" fill="#0f172a" text-anchor="middle">0.065200</text>

      <!-- Row 3: 農牧用地 -->
      <rect x="0" y="80" width="455" height="24" fill="#f8fafc" stroke="#cbd5e1" />
      <text x="20" y="96" font-size="11" fill="#475569">變更前_農牧用地</text>
      <text x="280" y="96" font-size="11" fill="#0f172a" text-anchor="middle">8</text>
      <text x="385" y="96" font-size="11" fill="#0f172a" text-anchor="middle">0.290900</text>

      <!-- Row 4: 礦業用地 -->
      <rect x="0" y="104" width="455" height="24" fill="#ffffff" stroke="#cbd5e1" />
      <text x="20" y="120" font-size="11" fill="#475569">變更前_礦業用地</text>
      <text x="280" y="120" font-size="11" fill="#0f172a" text-anchor="middle">35</text>
      <text x="385" y="120" font-size="11" fill="#0f172a" text-anchor="middle">3.673926</text>

      <!-- Row 5: 其他用地皆為 0 -->
      <rect x="0" y="128" width="455" height="24" fill="#f8fafc" stroke="#cbd5e1" />
      <text x="20" y="144" font-size="11" fill="#94a3b8">變更前_甲種、乙種、丁種...用地</text>
      <text x="280" y="144" font-size="11" fill="#94a3b8" text-anchor="middle">0</text>
      <text x="385" y="144" font-size="11" fill="#94a3b8" text-anchor="middle">0.000000</text>
    </g>

    <!-- Red Prompt Callout: 要確認筆數、面積與實際異動的數據是否一致 -->
    <g transform="translate(30, 215)">
      <rect x="0" y="0" width="415" height="42" rx="5" fill="#dc2626" />
      <text x="14" y="26" font-size="13" font-weight="bold" fill="#ffffff">
        ★ 要確認筆數、面積與實際異動的數據是否一致！
      </text>
    </g>

    <!-- Inspection Criteria Card -->
    <g transform="translate(15, 270)">
      <rect x="0" y="0" width="445" height="95" rx="6" fill="#f0fdf4" stroke="#86efac" />
      <text x="14" y="24" font-size="12" font-weight="bold" fill="#166534">檢核數據兩大必備規範：</text>
      <text x="14" y="46" font-size="11" fill="#14532d">
        1. <strong>筆數嚴格為整數：</strong>核對本半年公文系統核准變更編定函稿件數。
      </text>
      <text x="14" y="66" font-size="11" fill="#14532d">
        2. <strong>面積單位統一為公頃：</strong>小數點後精確維持 <strong>6 碼</strong>。
      </text>
      <text x="14" y="86" font-size="11" fill="#14532d">
        3. <strong>有誤即刻處理：</strong>若數據與列管表不符，請直接電洽地所承辦人重送。
      </text>
    </g>
  </g>
</svg>
